<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Monumental</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="stage" id="stage">
    <img class="stage__img" id="stage-img" src="img/monumental.jpg" width="2048" height="1366" alt="Vista del estadio Monumental">
    <div class="markers" id="markers"></div>
  </main>

  <p class="load-error" id="load-error" hidden>No se pudieron cargar los videos.</p>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <div class="modal__box">
      <header class="modal__header">
        <h2 class="modal__title" id="modal-title"></h2>
        <button type="button" class="modal__close" id="modal-close" aria-label="Cerrar">&times;</button>
      </header>
      <video class="modal__video" id="modal-video" controls playsinline preload="metadata"></video>
    </div>
  </dialog>

  <script src="js/app.js"></script>
</body>
</html>
